<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 240px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #18181a;
      color: #ffffff;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header img {
      width: 24px;
      height: 24px;
    }
    .title {
      font-size: 14px;
      font-weight: bold;
    }
    .card {
      background: #232328;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #33333c;
      margin-bottom: 10px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .toggle-row:last-child {
      margin-bottom: 0;
    }
    .label-text {
      font-size: 13px;
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0; height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3e3e48;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #ffcc00;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    .counter-card {
      text-align: center;
    }
    .count-val {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin: 2px 0;
    }
    .count-label {
      font-size: 11px;
      color: #8a8a93;
      margin-bottom: 10px;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid #44444e;
      color: #aaa;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: 0.2s;
    }
    .reset-btn:hover {
      background: #33333c;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon.png" alt="logo">
    <div class="title">Кинопоиск Марафон</div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <span class="label-text">Режим марафона</span>
      <label class="switch">
        <input type="checkbox" id="toggleState" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="label-text">Пауза при уходе</span>
      <label class="switch">
        <input type="checkbox" id="autoPauseState">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card counter-card">
    <div class="count-val" id="skipCount">0</div>
    <div class="count-label">пропущено реклам / заставок</div>
    <button class="reset-btn" id="resetBtn">Сбросить счетчик</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
